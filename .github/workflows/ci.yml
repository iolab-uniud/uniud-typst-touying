name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compila:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # la versione minima dichiarata in typst.toml e quella corrente
        typst: ["0.13.1", "0.15.1"]
    name: Typst ${{ matrix.typst }}
    steps:
      - uses: actions/checkout@v7

      - name: Installa Typst ${{ matrix.typst }}
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${{ matrix.typst }}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      # Compila i demo in tutte le varianti e costruisce i pacchetti: se un
      # layout si rompe, o se il pacchetto non si assembla, la build fallisce.
      - name: Compila i demo e impacchetta
        run: ./scripts/build-release.sh

      - name: Allega i PDF alla build
        if: matrix.typst == '0.15.1'
        uses: actions/upload-artifact@v7
        with:
          name: pdf-di-esempio
          path: dist/*.pdf
          retention-days: 14
